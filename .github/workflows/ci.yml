name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          path: agent-device-vphone
      - uses: actions/checkout@v4
        with:
          repository: bytemain/agent-device
          ref: jony/vphone-snapshot-producer-open
          path: agent-device-vphone-outtree-core
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: agent-device-vphone/pnpm-lock.yaml
      - name: Build core
        run: |
          pnpm install --frozen-lockfile
          pnpm build
        working-directory: agent-device-vphone-outtree-core
      - name: Test provider
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm typecheck
          pnpm test
          pnpm test:package
        working-directory: agent-device-vphone
